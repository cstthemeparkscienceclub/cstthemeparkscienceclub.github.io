<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サークル紹介</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="hero flex column align-center">
    <h1 class="title text-center">サークル紹介</h1>
    <div class="swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide flex column justify-start align-center">
                <h1>TPSC(テーマパークサイエンスサークル)とは？</h1>
                <p>本サークルは「テーマパークの研究」を行っているサークルです！<br>テーマパークは理工学の結晶であり、例えばジェットコースターには物理学や建築学、数学に機械工学など、多種多様な学問が応用されています。<br>理工学部ならではのユニークなサークルとなっています！</p>
            </div>
            <div class="swiper-slide flex column justify-start align-center">
                <h1>サークル概要</h1>
                <div><img src="februarydisney.jpg" alt="ディズニーシー冬期" style="width: 300px;"></div>
                <p>・所属人数：40名(男女比　27:13)<br>・活動場所：テーマパーク、駿河台校舎<br>・活動回数：月2回程度<br>・現地調査：2か月に1回程度</p>
            </div>
        </div>
    </div>
    <div class="swiper-pagination"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js">
</script>
<script src="../js.js"></script>
</body>
</html>
